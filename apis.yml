name: Token
description: >-
  Token Security is a cybersecurity company that secures non-human identities
  (NHIs) and AI agents across on-premises, hybrid, and cloud environments. Its
  platform continuously discovers every AI agent, service account, and machine
  identity, maps ownership and security posture, detects identity threats, and
  automates remediation. Capabilities span NHI inventory, security posture
  management, lifecycle management, secrets, and identity threat detection and
  response. The company also ships the Token MCP Server and a native Token AI
  Agent so security teams can query and act on NHI data conversationally from
  Claude, ChatGPT, Gemini, or Cursor. Backed by Bloomberg Beta, GGV Capital, and
  Qiming, Token Security serves enterprise security teams, CISOs, and IAM
  professionals governing machine and agent identity at scale.
